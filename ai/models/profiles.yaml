# =============================================================================
# MODEL PROFILES
# =============================================================================
# A profile bundles the four things that actually vary between kinds of work:
#   which model, which tools, which MCP servers, and how much autonomy.
#
#   ai profile              show the active profile
#   ai profile <name>       switch
#   ai profile list         show all
#
# The active profile is written to $DEVBOX_AI_STATE/active-profile and shown in
# the shell prompt, because "which permissions am I running with" is exactly the
# thing you must never have to guess.
#
# permissions.write / permissions.execute are enforced by translating them into
# the client's own permission config (see `devbox ai sync`), not by asking the
# model nicely.
# =============================================================================

apiVersion: devbox.ai/v1
kind: ModelProfiles
metadata:
  name: devbox-profiles

# Profiles name roles, not backends: the active provider (models.yaml
# `default_provider`, or `ai use <provider>`) supplies the model. One primary
# agent does the work; a reviewer from a different model family is invoked only
# where a second opinion pays for itself. Context is fetched on demand (LSP,
# graphify, rg) — `max_context_tokens` caps what a request may carry.

default: balanced

profiles:

  fast:
    description: "Routine work: small edits, summaries, commit messages, shell one-liners."
    model: fast
    reviewer: null
    max_output_tokens: 4096
    max_context_tokens: 32768
    permissions:
      read: [/workspace]
      write: [/workspace]
      execute: SAFE # only the SAFE command class
    mcp_profile: DEVELOPER
    mcp_servers: [filesystem, git]

  balanced:
    description: "The everyday default: implement, fix and test with the primary agent."
    model: coder
    reviewer: null
    max_output_tokens: 16384
    max_context_tokens: 65536 # Hermes' documented minimum for tool loops
    permissions:
      read: [/workspace]
      write: [/workspace]
      execute: REVIEW_REQUIRED
    mcp_profile: DEVELOPER
    mcp_servers: [filesystem, git, github, fetch, context7]

  deep:
    description: "Hard problems: tricky bugs, refactors, architecture. Reviewed by a second model family."
    model: architect
    reviewer: coder
    max_output_tokens: 32768
    max_context_tokens: 131072
    permissions:
      read: [/workspace]
      write: [/workspace]
      execute: REVIEW_REQUIRED
    mcp_profile: DEVELOPER
    mcp_servers: [filesystem, git, github, fetch, context7]

  terraform:
    description: "Infrastructure as code. Registry-grounded so provider attributes are looked up, not invented."
    model: coder
    reviewer: review
    max_output_tokens: 16384
    max_context_tokens: 65536
    permissions:
      read: [/workspace]
      write: [/workspace]
      execute: REVIEW_REQUIRED
    mcp_profile: DEVELOPER
    mcp_servers: [filesystem, git, terraform, context7, github]
    rules_focus: [terraform, cloud, engineering, secrets]

  code-review:
    description: "Reviewing a diff. Read-only by construction — a reviewer that edits is not a reviewer."
    model: review
    reviewer: null
    max_output_tokens: 8192
    max_context_tokens: 65536
    permissions:
      read: [/workspace]
      write: []
      execute: SAFE
    mcp_profile: READ_ONLY
    mcp_servers: [filesystem, git, github]

  secure:
    description: "Sensitive code: read-only, no tool network egress. Prompts still go to Ollama Cloud."
    model: coder
    reviewer: null
    max_output_tokens: 8192
    max_context_tokens: 32768
    permissions:
      read: [/workspace]
      write: []
      execute: NONE
    mcp_profile: READ_ONLY
    mcp_servers: [filesystem]
