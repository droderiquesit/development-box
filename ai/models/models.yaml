# =============================================================================
# PROVIDERS AND MODEL ALIASES
# =============================================================================
# Aliases are ROLE names, and every inference backend defines the same roles:
#
#   coder      primary agentic coder (implements, fixes, tests)
#   architect  hardest reasoning: architecture, design review, tricky bugs
#   fast       routine work: summaries, commit messages, small edits
#   review     second opinion from a different model family than `coder`
#
# Profiles, routing and agents name roles only, so switching backend is one
# command (`ai use <provider>`) and touches no other file.
#
# Default backend: `selfhosted` — the three largest open-weight models that fit
# one 8×H200 node, in your own GCP project (infra/gcp-models/,
# docs/gcp-models.md). You pay for GPU hours (~$43/h per model on Spot); the
# VMs stop themselves after 20 idle minutes and after 4 hours regardless.
#
# Credentials are read at runtime (environment, or the 0600 state file written
# by `ai up`). Nothing here is a secret and nothing here is baked into the image.
# =============================================================================

apiVersion: devbox.ai/v1
kind: ModelCatalog
metadata:
  name: devbox-models

default_provider: selfhosted

providers:

  # --------------------------------------------------------------------------
  # Self-hosted vLLM on Compute Engine, reached through IAP tunnels that
  # `ai up <role>` opens to localhost. OpenAI- and Anthropic-compatible.
  # --------------------------------------------------------------------------
  selfhosted:
    enabled: true
    kind: openai_compatible
    agent_cli: hermes
    credential_env: DEVBOX_MODELS_API_KEY
    credential_optional: true     # `ai up` fetches it from Secret Manager
    gcp:
      project_env: DEVBOX_GCP_PROJECT
      zone_env: DEVBOX_GCP_ZONE
      instance_prefix: devbox-model-
      api_key_secret: devbox-models-api-key
      remote_port: 8000
    request:
      timeout_seconds: 900        # long agentic generations on 1T-class models
      retries: 3
      backoff_seconds: 4
    # served model name → where it listens locally once tunnelled.
    endpoints:                    # mirrors infra/gcp-models/variables.tf
      architect: {local_port: 18001, model: moonshotai/Kimi-K2.6,             context_tokens: 262144}
      coder:     {local_port: 18002, model: deepseek-ai/DeepSeek-V4-Pro-0813, context_tokens: 200000}
      fast:      {local_port: 18003, model: zai-org/GLM-5.3,                  context_tokens: 262144}
    aliases:
      coder:     coder
      architect: architect
      fast:      fast
      review:    architect        # Kimi reviews DeepSeek's code: different family

  # --------------------------------------------------------------------------
  # Ollama Cloud — hosted alternative, no GPUs to run. Free plan: gpt-oss,
  # gemma4 and nemotron-3 only, ONE concurrent request, a small monthly
  # allowance shared by all models (HTTP 429 "monthly usage limit" when spent;
  # `ai quota` reports it). Two transports, picked automatically:
  #   OLLAMA_API_KEY set → https://ollama.com directly
  #   no key             → the host's signed-in Ollama daemon (`-cloud` models)
  # --------------------------------------------------------------------------
  ollama_cloud:
    enabled: true
    kind: ollama_cloud
    agent_cli: hermes
    credential_env: OLLAMA_API_KEY
    credential_optional: true
    base_url_env: OLLAMA_CLOUD_URL
    base_url_default: https://ollama.com
    proxy_url_env: OLLAMA_BASE_URL
    proxy_url_default: http://host.containers.internal:11434
    request:
      timeout_seconds: 300
      retries: 3                  # 429 queue-full and 5xx, exponential backoff
      backoff_seconds: 4
    aliases:
      coder:     gpt-oss:120b
      architect: nemotron-3-ultra
      fast:      gpt-oss:20b
      review:    nemotron-3-super
    context_tokens:               # from /api/show, 2026-10
      gpt-oss:120b: 131072
      gpt-oss:20b: 131072
      nemotron-3-ultra: 262144
      nemotron-3-super: 262144
      gemma4:31b: 262144

  # --------------------------------------------------------------------------
  # Gemini CLI on the Google free tier (sign in with `gemini`, or a free AI
  # Studio key). A no-GPU fallback.
  # --------------------------------------------------------------------------
  google:
    enabled: true
    kind: native
    cli: gemini
    credential_env: GEMINI_API_KEY
    credential_optional: true
    discovery:
      url: https://generativelanguage.googleapis.com/v1beta/models
      headers:
        x-goog-api-key: "${GEMINI_API_KEY}"
      json_path: ".models[].name"
    aliases:
      gemini:      gemini-2.5-pro
      gemini-fast: gemini-2.5-flash

  # --------------------------------------------------------------------------
  # Paid APIs — disabled. Set `enabled: true` to opt in.
  # --------------------------------------------------------------------------
  anthropic:
    enabled: false
    kind: native
    cli: claude
    credential_env: ANTHROPIC_API_KEY
    discovery:
      url: https://api.anthropic.com/v1/models
      headers:
        x-api-key: "${ANTHROPIC_API_KEY}"
        anthropic-version: "2023-06-01"
      json_path: ".data[].id"
    aliases:
      claude:       claude-sonnet-5-5
      claude-fast:  claude-haiku-4-5
      claude-deep:  claude-opus-5-5

  openai:
    enabled: false
    kind: native
    cli: codex
    credential_env: OPENAI_API_KEY
    discovery:
      url: https://api.openai.com/v1/models
      headers:
        Authorization: "Bearer ${OPENAI_API_KEY}"
      json_path: ".data[].id"
    aliases:
      gpt:    gpt-5
      codex:  gpt-5-codex
