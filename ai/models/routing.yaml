# =============================================================================
# TASK ROUTING
# =============================================================================
# Which model handles which kind of work, and who checks it.
#
#   ai run <workflow>              run a defined workflow
#   ai run <workflow> --model X    manual override, always available
#   ai ask "..." --task terraform  route a one-shot question by task type
#
# The rationale for routing at all: model families have genuinely different
# strengths and, more usefully, different failure modes. A second model reviewing
# the first catches things a second pass from the *same* model will not, because
# it does not share the same blind spots.
#
# Aliases are roles defined by every backend (ai/models/models.yaml):
#   coder (primary), architect (hard reasoning), fast (routine),
#   review (second opinion from a different model family).
#
# HARD LIMITS come from ai/policies/policy.yaml → limits (steps, iterations,
# timeout, no self-invocation). A workflow is a fixed, declared sequence — no
# agent decides what runs next.
# =============================================================================

apiVersion: devbox.ai/v1
kind: TaskRouting
metadata:
  name: devbox-routing

routing:

  terraform:
    primary: coder
    reviewer: review
    profile: terraform
    rationale: "Primary authors against the registry MCP server; a different model family reviews because it fails differently."

  python:
    primary: coder
    reviewer: review
    profile: balanced

  go:
    primary: coder
    reviewer: review
    profile: balanced

  typescript:
    primary: coder
    reviewer: review
    profile: balanced

  bash:
    primary: coder
    reviewer: null
    profile: fast
    post_checks: [shellcheck]

  kubernetes:
    primary: coder
    reviewer: review
    profile: balanced

  github-actions:
    primary: coder
    reviewer: null
    profile: balanced
    post_checks: [actionlint, yamllint, shellcheck]

  architecture:
    primary: coder
    reviewer: review
    profile: deep

  research:
    primary: architect
    reviewer: null
    profile: balanced
    rationale: "Largest free context window (256K) for reading a spec at once."

  security:
    primary: coder
    reviewer: review
    profile: code-review
    post_checks: [trivy, checkov, gitleaks, semgrep]

  documentation:
    primary: coder
    reviewer: null
    profile: balanced

  docs-sync:
    primary: coder
    reviewer: review
    profile: deep

# -----------------------------------------------------------------------------
# Workflows. Each is a fixed pipeline of declared steps. `ai run <name>`.
# Step kinds:
#   agent  — an AI role from ai/agents/ runs with a specific model
#   tool   — a deterministic tool runs; its output feeds the next step
#   human  — execution stops and waits for a person
# -----------------------------------------------------------------------------
workflows:

  terraform-review:
    description: "Author or review Terraform, then have it independently reviewed, scanned, costed, and handed to a human."
    max_steps: 6
    steps:
      - {kind: agent, role: terraform-agent, model: coder,  action: analyse}
      - {kind: agent, role: code-review-agent, model: review, action: review, input: previous}
      - {kind: tool,  run: "devbox terraform check"}
      - {kind: tool,  run: "devbox security scan --scope terraform"}
      - {kind: tool,  run: "infracost breakdown --path .", optional: true}
      - {kind: human, action: approve, message: "Review the findings above. No changes have been applied."}

  architecture-review:
    description: "Design proposal, adversarially reviewed by a different model family."
    max_steps: 4
    steps:
      - {kind: agent, role: architecture-agent, model: coder, action: propose}
      - {kind: agent, role: architecture-agent, model: architect, action: challenge, input: previous}
      - {kind: agent, role: cost-agent,         model: coder, action: estimate, input: previous}
      - {kind: human, action: approve}

  security-review:
    description: "Full local security pass over the working tree, then an AI triage of the findings."
    max_steps: 4
    steps:
      - {kind: tool,  run: "devbox security scan --format json"}
      - {kind: agent, role: security-agent, model: coder, action: triage, input: previous}
      - {kind: agent, role: security-agent, model: review,  action: verify, input: previous}
      - {kind: human, action: approve}

  github-actions-review:
    description: "Static validation of workflows, then a review of what static analysis cannot see."
    max_steps: 3
    steps:
      - {kind: tool,  run: "devbox github check"}
      - {kind: agent, role: github-agent, model: coder, action: review, input: previous}
      - {kind: human, action: approve}

  incident-analysis:
    description: "Blameless incident analysis from logs and timeline. Read-only throughout."
    max_steps: 3
    profile: code-review
    steps:
      - {kind: agent, role: sre-agent, model: coder, action: analyse}
      - {kind: agent, role: sre-agent, model: review,  action: challenge, input: previous}
      - {kind: human, action: approve}
