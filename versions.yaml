# =============================================================================
# AI Engineering DevBox — canonical version manifest
# =============================================================================
# This is the SINGLE SOURCE OF TRUTH for every pinned tool version.
#
#   * `scripts/lib/versions.sh` renders this file into shell variables that the
#     install scripts consume, so nothing is pinned twice.
#   * Renovate (see renovate.json) opens PRs against this file only.
#   * `devbox versions` prints the manifest next to what is actually installed.
#
# PINNING POLICY
#   exact   -> reproducible builds, Renovate-managed  (Go tools, tarballs)
#   apt     -> tracked by the vendor's signed apt repo, pinned to major.minor
#   channel -> intentionally floating (npm dist-tags for AI CLIs, which ship
#              multiple releases per week and are useless when stale)
#
# Verified against upstream release metadata on 2026-08-16.
# =============================================================================

# -----------------------------------------------------------------------------
# Release version
# -----------------------------------------------------------------------------
#   devbox  the version of the DevBox image this repository produces.
#           Cutting a release is a `v<semver>` git tag (or the release.yml
#           dispatch input) at a commit where this value matches.
release:
  devbox: "1.0.0"

metadata:
  schema: 1

# -----------------------------------------------------------------------------
# The base image — an EXTERNAL dependency, owned by the Base Image Factory
# -----------------------------------------------------------------------------
# The DevBox builds FROM a published release of the factory's ai-engineering
# image (repo: droderiquesit/base-image-factory — see its
# docs/image-contract.md for exactly what the base does and does not
# provide). It is a registry artefact, pulled — never rebuilt as a side
# effect of a DevBox build.
#
# Bumping `version` (+ `digest`) here IS the base patching mechanism: one
# reviewable, revertable commit, gated by this repository's full test suite
# against the new base before anything ships. Renovate keeps the digest in
# step with the version and opens the PR when the factory publishes a new
# release (see renovate.json).
#
# What used to live here — the Ubuntu tag/digest and the Go/Node/Python/uv
# runtime pins — moved with the base's lifecycle to the factory repository
# (images/ai-engineering/versions.yaml there). See docs/decisions.md.
base:
  repo: ghcr.io/droderiquesit/base-image-factory/ai-engineering
  # renovate: the custom manager in renovate.json tracks version+digest as one
  version: "1.0.1"
  digest: "sha256:8a2b04bba177b5790563eb2b2a48947e5388e7a14b190743f13b62e308d25f77"

# -----------------------------------------------------------------------------
# Infrastructure as Code
# -----------------------------------------------------------------------------
iac:
  # renovate: datasource=github-releases depName=hashicorp/terraform
  terraform: "1.15.8"        # apt.releases.hashicorp.com (signed)
  # renovate: datasource=github-releases depName=opentofu/opentofu
  opentofu: "1.12.5"         # packages.opentofu.org (signed)
  # renovate: datasource=github-releases depName=gruntwork-io/terragrunt
  terragrunt: "v1.1.3"       # release artefact, SHA-256 verified
  # renovate: datasource=go depName=github.com/hashicorp/terraform-ls
  terraform_ls: "v0.39.0"    # go install
  # renovate: datasource=go depName=github.com/terraform-docs/terraform-docs
  terraform_docs: "v0.24.0"  # go install
  # renovate: datasource=go depName=github.com/terraform-linters/tflint
  tflint: "v0.64.0"          # go install
  # renovate: datasource=github-releases depName=infracost/infracost
  infracost: "v0.10.45"      # release artefact, SHA-256 verified
  # renovate: datasource=pypi depName=checkov
  checkov: "3.3.11"          # uv tool (PyPI)

# -----------------------------------------------------------------------------
# Kubernetes / GitOps
# -----------------------------------------------------------------------------
kubernetes:
  # renovate: datasource=github-releases depName=kubernetes/kubernetes
  kubectl: "v1.36.3"         # dl.k8s.io tarball, checksum-verified
  # renovate: datasource=github-releases depName=helm/helm
  helm: "v4.2.4"             # get.helm.sh tarball, checksum-verified
  # renovate: datasource=go depName=sigs.k8s.io/kustomize/kustomize/v5
  kustomize: "v5.8.1"        # go install
  # renovate: datasource=go depName=github.com/derailed/k9s
  k9s: "v0.51.0"             # go install
  # renovate: datasource=go depName=github.com/stern/stern
  stern: "v1.34.0"           # go install
  # renovate: datasource=go depName=github.com/ahmetb/kubectx
  kubectx: "v0.11.0"         # go install (provides kubectx + kubens)
  # renovate: datasource=github-releases depName=fluxcd/flux2
  flux: "v2.9.4"             # release artefact, SHA-256 verified
  # kind/k3d are OPTIONAL: see docs/decisions.md. Enabled with FEATURE_K8S_LOCAL.
  # renovate: datasource=go depName=sigs.k8s.io/kind
  kind: "v0.32.0"            # go install

