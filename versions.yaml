  trivy: "0.69"              # aquasecurity apt repo, major.minor
  # renovate: datasource=go depName=github.com/zricethezav/gitleaks/v8
  gitleaks: "v8.30.1"        # go install
  # renovate: datasource=go depName=github.com/open-policy-agent/opa
  opa: "v1.19.0"             # go install
  # renovate: datasource=go depName=github.com/open-policy-agent/conftest
  conftest: "v0.69.0"        # go install
  # renovate: datasource=go depName=github.com/anchore/syft
  syft: "v1.51.0"            # go install
  # renovate: datasource=go depName=github.com/anchore/grype
  grype: "v0.117.0"          # go install
  # renovate: datasource=go depName=github.com/sigstore/cosign/v2
  cosign: "v2.6.5"           # go install
  # renovate: datasource=pypi depName=semgrep
  semgrep: "1.145.0"         # uv tool (PyPI)

# -----------------------------------------------------------------------------
# Developer tooling
# -----------------------------------------------------------------------------
tools:
  # renovate: datasource=go depName=github.com/mikefarah/yq/v4
  yq: "v4.53.3"              # go install
  # renovate: datasource=go depName=github.com/go-task/task/v3
  task: "v3.52.0"            # go install
  # renovate: datasource=go depName=github.com/rhysd/actionlint
  actionlint: "v1.7.12"      # go install
  # renovate: datasource=go depName=github.com/junegunn/fzf
  fzf: "v0.74.2"             # go install
  # renovate: datasource=go depName=github.com/jesseduffield/lazygit
  lazygit: "v0.64.1"         # go install
  # just is a Rust crate; installed from the Ubuntu archive (universe) to avoid
  # dragging a Rust toolchain into the image. See docs/decisions.md.
  # renovate: datasource=pypi depName=yamllint
  yamllint: "1.38.0"         # uv tool (PyPI)
  # renovate: datasource=pypi depName=pre-commit
  pre_commit: "4.6.2"        # uv tool (PyPI)
  # renovate: datasource=pypi depName=ruff
  ruff: "0.16.3"             # uv tool (PyPI)
  # renovate: datasource=pypi depName=black
  black: "26.5.1"            # uv tool (PyPI)
  # renovate: datasource=pypi depName=mypy
  mypy: "2.3.1"              # uv tool (PyPI)
  # renovate: datasource=pypi depName=pytest
  pytest: "9.1.1"            # uv tool (PyPI)
  # renovate: datasource=pypi depName=ansible-lint
  ansible_lint: "26.8.0"     # uv tool (PyPI), OPTIONAL feature

# -----------------------------------------------------------------------------
# Cloud CLIs (OPTIONAL modules — FEATURE_CLOUD_{AZURE,AWS,GCP})
# -----------------------------------------------------------------------------
cloud:
  awscli: "2"                # awscli.amazonaws.com installer, GPG-verified
  azurecli: "apt"            # packages.microsoft.com (signed), tracks stable
  gcloud: "apt"              # packages.cloud.google.com (signed), tracks stable

# -----------------------------------------------------------------------------
# AI clients
# -----------------------------------------------------------------------------
# Channel-pinned on purpose: these ship several releases per week and an exact
# pin here goes stale within days. `devbox update ai` re-resolves the channel and
# `devbox versions` always reports the resolved version. Pin exactly by replacing
# "latest" with a version string if your change-control process requires it.
ai:
  claude_code: "latest"      # npm @anthropic-ai/claude-code
  codex: "latest"            # npm @openai/codex
  gemini_cli: "latest"       # npm @google/gemini-cli
  # renovate: datasource=pypi depName=litellm
  litellm: "1.97.0"          # uv tool (PyPI) — model router, exact pin
  # renovate: datasource=pypi depName=llm
  llm: "0.32"                # uv tool (PyPI) — scriptable one-shot prompts
  # OPTIONAL, off by default (FEATURE_AI_EXTRA):
  # renovate: datasource=pypi depName=aider-chat
  aider: "0.86.2"            # uv tool (PyPI)
  opencode: "latest"         # npm opencode-ai

# -----------------------------------------------------------------------------
# MCP servers (installed only when enabled in mcp/servers.yaml)
# -----------------------------------------------------------------------------
mcp:
  filesystem: "latest"       # npm @modelcontextprotocol/server-filesystem
  memory: "latest"           # npm @modelcontextprotocol/server-memory
  sequential_thinking: "latest"  # npm @modelcontextprotocol/server-sequential-thinking
  # renovate: datasource=pypi depName=mcp-server-git
  git: "2026.7.10"           # uv tool (PyPI) mcp-server-git
  # renovate: datasource=pypi depName=mcp-server-fetch
  fetch: "2026.7.10"         # uv tool (PyPI) mcp-server-fetch
  # renovate: datasource=pypi depName=mcp-server-time
  time: "2026.7.10"          # uv tool (PyPI) mcp-server-time
  context7: "latest"         # npm @upstash/context7-mcp — library docs
  playwright: "latest"       # npm @playwright/mcp — browser research (OPTIONAL)
  kubernetes: "latest"       # npm kubernetes-mcp-server (OPTIONAL)
  # github + terraform MCP servers run as OCI containers, not in-image binaries:
  github_image: "ghcr.io/github/github-mcp-server:latest"
  terraform_image: "docker.io/hashicorp/terraform-mcp-server:latest"
