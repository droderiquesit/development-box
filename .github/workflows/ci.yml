---
# =============================================================================
# CI — fast checks on every push and pull request.
# =============================================================================
# Everything here must finish in a couple of minutes. Image builds live in
# build-base.yml / build-devbox.yml so that a typo in a markdown file does not
# cost twenty minutes of runner time.
#
# Every tool is installed through .github/actions/go-tools, which restores
# ~/go/bin from cache keyed on the exact pins. Before that, five jobs compiled
# overlapping sets of Go tools from source on every single run.
#
# All third-party actions are pinned to a full commit SHA. Tags are mutable and a
# compromised tag is a compromised build — `devbox github check` enforces this.
name: ci

"on":
  push:
    branches: [main, develop, 'claude/**']
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

# GitHub's default `run` shell is `bash -e` — WITHOUT pipefail. That is how the
# JSONC check below sat green for a whole run while validating nothing: its
# `npx ... | jq empty` had a broken producer, and `jq empty` succeeds on empty
# input, so the pipeline reported the consumer's zero. Naming the shell
# explicitly gets `bash -eo pipefail` and makes a broken producer fail loudly.
defaults:
  run:
    shell: bash

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:

  lint-shell:
    name: shell
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: ./.github/actions/go-tools
        with:
          tools: mvdan.cc/sh/v3/cmd/shfmt@v3.12.0

      - name: shellcheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends shellcheck
          mapfile -t files < <(find bin scripts tests -type f \
            \( -name '*.sh' -o -name devbox -o -name ai -o -name mcp \) 2>/dev/null)
          printf 'checking %d files\n' "${#files[@]}"
          shellcheck -x -S warning "${files[@]}"

      - name: shfmt
        run: |
          shfmt -d -i 2 -ci bin scripts config/shell || {
            echo "::error::shell formatting differs — run: shfmt -w -i 2 -ci bin scripts config/shell"
            exit 1
          }

  lint-config:
    name: yaml / json / actions
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: .github/requirements-ci.txt

      - uses: ./.github/actions/go-tools
        with:
          tools: github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

      - name: yamllint
        run: |
          pip install --quiet -r .github/requirements-ci.txt
          yamllint -c config/tools/yamllint.yaml .

      - name: actionlint
        run: actionlint -color

      - name: JSONC configuration parses
        run: |
          set -euo pipefail
          # .vscode and .devcontainer are JSONC (comments allowed), so validate
          # them the way VS Code does rather than with a strict JSON parser.
          npm ci --prefix .github/tooling --no-audit --no-fund
          strip=".github/tooling/node_modules/.bin/strip-json-comments"

          for f in .devcontainer/devcontainer.json .vscode/*.json; do
            [ -e "$f" ] || continue
            out="$("$strip" "$f")"
            # Assert the stripper actually produced something. Piping straight
            # into `jq empty` cannot tell "valid JSON" from "no input at all",
            # and an empty pipe is exactly what a broken tool produces.
            [ -n "$out" ] || { echo "::error::$f produced no output"; exit 1; }
            printf '%s' "$out" | jq empty || { echo "::error::$f is not valid JSONC"; exit 1; }
            echo "ok $f"
          done

  validate-config:
    name: devbox configuration
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: ./.github/actions/go-tools
        with:
          tools: github.com/mikefarah/yq/v4@v4.53.3

      - name: validate versions.yaml, policies and MCP registry
        run: tests/validate-config.sh

      - name: generated AI instruction files are current
        run: scripts/configure/render-ai-rules.sh --check

  security:
    name: secrets / SAST
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0        # gitleaks needs full history to be useful

      - uses: ./.github/actions/go-tools
        with:
          tools: github.com/zricethezav/gitleaks/v8@v8.30.1

      - name: gitleaks
        run: |
          # Known historical findings are listed, with their remediation status,
          # in .gitleaksignore. Fingerprints there are commit-scoped, so a new
          # leak — including the same secret in a new commit — still fails here.
          gitleaks git . --redact --verbose

      - uses: ./.github/actions/trivy

      - name: trivy config (IaC + Containerfiles)
        run: |
          # exit-code 0: findings are reported through the SARIF upload and the
          # Security tab, not by failing every unrelated pull request.
          trivy config . --format sarif --output trivy-config.sarif --exit-code 0

      - name: upload SARIF
        uses: github/codeql-action/upload-sarif@4e828ff8d448a8a6e532957b1811f387a63867e8 # v3.29.4
        # `always()` alone made this run even when an earlier step failed and no
        # scan ever happened, so it failed a second time on the missing file and
        # buried the real error. Upload only if there is something to upload.
        if: always() && hashFiles('trivy-config.sarif') != ''
        with:
          sarif_file: trivy-config.sarif
          category: trivy-config

  docs:
    name: markdown
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: markdownlint
        run: |
          # Rule configuration lives in .markdownlint.yaml so that this and the
          # pre-commit hook and a developer's editor all apply the same rules.
          # It used to be passed as --disable flags here, which meant CI failed
          # on rules that were green locally.
          npm ci --prefix .github/tooling --no-audit --no-fund
          node .github/tooling/node_modules/.bin/markdownlint \
            '**/*.md' --ignore node_modules --ignore .github/tooling
