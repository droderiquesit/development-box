# =============================================================================
# Hermes agents on Cloud Run — validate on PRs, build + deploy on main.
# =============================================================================
#   pull_request   validate Terraform + scripts, test-build the agent image
#   push to main   build + push the image to Artifact Registry, plan, then
#                  apply after a human approves the `gcp-models` environment
#   dispatch       same as push (re-deploy, e.g. after adding an agent)
#
# One-time setup: infra/gcp-agents/bootstrap-agents.sh (grants the existing
# deploy service account what this root needs). See docs/agents.md.
# =============================================================================
name: gcp-agents

on:
  pull_request:
    paths:
      - 'infra/gcp-agents/**'
      - 'platform/hermes-agent/**'
      - '.github/workflows/gcp-agents.yml'
  push:
    branches: [main]
    paths:
      - 'infra/gcp-agents/**'
      - 'platform/hermes-agent/**'
      - '.github/workflows/gcp-agents.yml'
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  TF_DIR: infra/gcp-agents
  TF_IN_AUTOMATION: '1'
  TF_INPUT: '0'
  REGION: us-central1

concurrency:
  group: gcp-agents-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:

  validate:
    name: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: tool pins from versions.yaml
        id: pins
        run: |
          set -euo pipefail
          pin() {
            awk -v sec="$1:" -v key="  $2:" '
              $0 == sec {s=1; next}
              s && index($0, key) == 1 {gsub(/.*: *"?|".*/, ""); print; exit}
              s && /^[a-z]/ {exit}' versions.yaml
          }
          for k in terraform tflint checkov; do
            v="$(pin iac "$k")"
            [ -n "$v" ] || { echo "::error::versions.yaml iac.$k not found"; exit 1; }
            echo "$k=$v" >> "$GITHUB_OUTPUT"
          done

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ steps.pins.outputs.terraform }}
          terraform_wrapper: false

      - uses: ./.github/actions/go-tools
        with:
          tools: github.com/terraform-linters/tflint@${{ steps.pins.outputs.tflint }}

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - uses: ./.github/actions/trivy

      - name: terraform fmt + validate
        run: |
          terraform -chdir="$TF_DIR" fmt -check -recursive -diff
          terraform -chdir="$TF_DIR" init -backend=false
          terraform -chdir="$TF_DIR" validate

      - name: tflint
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          cd "$TF_DIR"
          tflint --init
          tflint --format compact

      - name: checkov
        env:
          CHECKOV_VERSION: ${{ steps.pins.outputs.checkov }}
        run: |
          pip install --quiet "checkov==${CHECKOV_VERSION}"
          checkov -d "$TF_DIR" --framework terraform --compact --quiet

      - name: trivy config
        run: trivy config --exit-code 1 --severity MEDIUM,HIGH,CRITICAL "$TF_DIR"

      - name: shellcheck
        run: |
          shellcheck -S style "$TF_DIR"/*.sh platform/hermes-agent/entrypoint.sh

      - name: test-build the agent image
        run: docker build -f platform/hermes-agent/Containerfile -t hermes-agent:ci platform/hermes-agent

  deploy:
    name: build, push, apply
    needs: validate
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      vars.GCP_WIF_PROVIDER != '' && vars.GCP_DEPLOY_SA != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: gcp-models    # required reviewers = the human approval gate
    concurrency:
      group: gcp-agents-deploy
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        id: auth
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}
          token_format: access_token

      - name: build + push the agent image
        id: image
        env:
          PROJECT: ${{ vars.GCP_PROJECT_ID }}
          TOKEN: ${{ steps.auth.outputs.access_token }}
        run: |
          set -euo pipefail
          repo="${REGION}-docker.pkg.dev/${PROJECT}/devbox-agents/hermes-agent"
          printf '%s' "$TOKEN" | docker login -u oauth2accesstoken --password-stdin "${REGION}-docker.pkg.dev"
          docker build -f platform/hermes-agent/Containerfile -t "${repo}:${GITHUB_SHA::12}" platform/hermes-agent
          docker push "${repo}:${GITHUB_SHA::12}"
          digest="$(docker inspect --format '{{index .RepoDigests 0}}' "${repo}:${GITHUB_SHA::12}")"
          echo "digest=${digest##*@}" >> "$GITHUB_OUTPUT"
          echo "pushed ${repo}@${digest##*@}" >> "$GITHUB_STEP_SUMMARY"

      - name: terraform version
        id: tfver
        run: |
          v="$(awk '/^iac:/{s=1;next} s&&/^  terraform:/{gsub(/.*: *"?|".*/,"");print;exit}' versions.yaml)"
          echo "v=$v" >> "$GITHUB_OUTPUT"

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ steps.tfver.outputs.v }}
          terraform_wrapper: false

      - name: terraform plan + apply
        env:
          PROJECT: ${{ vars.GCP_PROJECT_ID }}
          USERS: ${{ vars.GCP_IAP_MEMBERS }}
          STATE_BUCKET: ${{ vars.GCP_TF_STATE_BUCKET }}
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          set -euo pipefail
          cd "$TF_DIR"
          python3 - > ci.auto.tfvars.json <<'PY'
          import json, os
          print(json.dumps({
              "project_id": os.environ["PROJECT"],
              "users": json.loads(os.environ.get("USERS") or "[]"),
              "image_digest": os.environ["DIGEST"],
          }, indent=2))
          PY
          terraform init -backend-config="bucket=${STATE_BUCKET}" -backend-config="prefix=gcp-agents"
          terraform plan -lock-timeout=5m -out=tfplan
          {
            echo "## terraform plan — infra/gcp-agents"
            echo '```'
            terraform show -no-color tfplan | tail -c 60000
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          terraform apply -lock-timeout=5m tfplan
          echo "### Agent URLs" >> "$GITHUB_STEP_SUMMARY"
          terraform output -json agent_urls >> "$GITHUB_STEP_SUMMARY"
