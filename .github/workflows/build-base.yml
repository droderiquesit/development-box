---
# =============================================================================
# BASE image — build, test, publish.
# =============================================================================
# The base carries the slow-moving foundation: Ubuntu 24.04 LTS, the non-root
# `dev` user, Go/Node/Python + uv, and the shell. It changes for two reasons
# only — an OS security patch, or a language runtime bump.
#
# It is published to GHCR as an INDEPENDENTLY VERSIONED artefact. The DevBox
# build pulls a pinned release of it; it never rebuilds the base as a side
# effect. That separation is what makes base patching possible:
#
#   1. an OS CVE lands, or the weekly schedule fires
#   2. tag `base-v1.0.1`  -> this workflow publishes base 1.0.1
#   3. bump `release.base` in versions.yaml to 1.0.1 in a PR
#   4. build-devbox rebuilds the DevBox on the patched base and runs the full
#      test suite against it BEFORE anything ships
#
# Step 4 is why the pin is a file and not a floating tag. `:latest` would give
# you the patch with no test gate and no way to roll back except a revert race.
name: build-base

"on":
  push:
    branches: [main, develop]
    paths:
      - 'Containerfile.base'
      - 'versions.yaml'
      - 'scripts/lib/**'
      - 'scripts/install/10-os-base.sh'
      - 'scripts/install/20-languages.sh'
      - 'config/shell/**'
      - 'config/ca-certificates/**'
      - '.github/workflows/build-base.yml'
      - '.github/scripts/**'
    tags: ['base-v*.*.*']
  pull_request:
    paths:
      - 'Containerfile.base'
      - 'versions.yaml'
      - 'scripts/install/1*.sh'
      - 'scripts/install/2*.sh'
      - 'config/shell/**'
  schedule:
    # Weekly, so OS security updates land without anyone remembering to ask.
    # This publishes :edge only — promoting a patch to a release is a human
    # tagging `base-v*`, because that is what starts the test-and-pin flow above.
    - cron: '0 5 * * 1'
  workflow_dispatch:
    inputs:
      push_image:
        description: Push to the registry (untagged builds publish :edge only)
        type: boolean
        default: false
      release_version:
        description: >-
          Publish a full base RELEASE at this version (e.g. 1.0.1): semver
          ladder, signature, git tag and GitHub release. Equivalent to pushing
          the base-v<version> tag — this path exists so a release can be cut
          from environments that can call the Actions API but cannot push tags.
        type: string
        default: ''

permissions:
  contents: read

defaults:
  run:
    shell: bash            # bash -eo pipefail; the default `bash -e` has no pipefail

env:
  REGISTRY: ghcr.io
  # Layer cache lives in GHCR beside the image it caches. One cache repo across
  # branches is deliberate: a branch touching only the shell profile reuses
  # main's OS and language layers. Entries are content-addressed, so a changed
  # instruction misses rather than returning something stale.
  CACHE_REPO: ghcr.io/${{ github.repository }}-base/buildcache

concurrency:
  group: build-base-${{ github.ref }}
  cancel-in-progress: true

jobs:

  build:
    name: build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
      id-token: write        # cosign keyless signing
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          # linux/arm64 is deliberately absent: the ubuntu-24.04-arm hosted
          # runner label only exists for PUBLIC repositories, so on a private
          # repo the job queues forever and the publish job (needs: build)
          # never runs — the release silently hangs. Re-add the pair
          #   - platform: linux/arm64
          #     runner: ubuntu-24.04-arm
          # (and the arch in the publish job's manifest loop) if this repo
          # goes public or a self-hosted/larger arm runner is configured.

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # Podman is what developers use locally, so CI builds with Podman too.
      # A build that only works in BuildKit is not the build we ship.
      - name: podman version
        run: podman version

      - name: derive metadata
        id: meta
        env:
          RELEASE_INPUT: ${{ inputs.release_version }}
        run: |
          set -euo pipefail
          # A release build is either a `base-v*` tag push or a dispatch that
          # names a release_version. Anything else takes its version from the
          # pin, purely for image labels.
          if [ "${GITHUB_REF_TYPE}" = tag ]; then
            version="${GITHUB_REF_NAME#base-v}"
          elif [ -n "${RELEASE_INPUT}" ]; then
            version="${RELEASE_INPUT}"
          else
            version="$(.github/scripts/image-ref.sh base-version)"
          fi
          {
            echo "sha=$(git rev-parse --short HEAD)"
            echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "version=${version}"
            echo "arch=$(echo '${{ matrix.platform }}' | tr '/' '-')"
            echo "repo=$(.github/scripts/image-ref.sh base-repo)"
          } >> "$GITHUB_OUTPUT"

      # Log in before building: --cache-from READS from GHCR, so an anonymous
      # build silently misses every entry on a private repository and merely
      # looks slow rather than misconfigured.
      - name: log in to the registry
        run: |
          # Both keychains, deliberately: podman writes containers/auth.json,
          # which podman and skopeo read — but cosign uses go-containerregistry,
          # which reads the DOCKER keychain (~/.docker/config.json). With only
          # podman login, the push succeeds and the signing step then fails
          # UNAUTHORIZED on the very image that was just pushed.
          echo "${{ secrets.GITHUB_TOKEN }}" | \
            podman login "$REGISTRY" -u "${{ github.actor }}" --password-stdin
          echo "${{ secrets.GITHUB_TOKEN }}" | \
            docker login "$REGISTRY" -u "${{ github.actor }}" --password-stdin

      - name: build
        env:
          # Only trusted events may WRITE the cache. A pull request, especially
          # from a fork, must never be able to poison the layers main builds on.
          CACHE_PUSH: ${{ (github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref_type == 'tag' || inputs.release_version != '')) && '1' || '0' }}
        run: |
          .github/scripts/podman-build.sh \
            Containerfile.base \
            "localhost/base:${{ steps.meta.outputs.sha }}" \
            --build-arg VCS_REF="${{ steps.meta.outputs.sha }}" \
            --build-arg BUILD_DATE="${{ steps.meta.outputs.date }}" \
            --build-arg VERSION="${{ steps.meta.outputs.version }}"

      - name: smoke test
        run: |
          set -euo pipefail
          img="localhost/base:${{ steps.meta.outputs.sha }}"
          # The base image's contract: non-root, three working runtimes, uv.
          podman run --rm "$img" bash -lc '
            set -e
            [ "$(id -u)" -ne 0 ] || { echo "FAIL: running as root"; exit 1; }
            go version && node --version && python3 --version && uv --version
            git --version && jq --version
            touch /workspace/.probe && rm /workspace/.probe
            echo "base image smoke test passed"
          '

      - uses: ./.github/actions/go-tools
        with:
          tools: >-
            github.com/anchore/syft/cmd/syft@v1.51.0
            github.com/anchore/grype/cmd/grype@v0.117.0
            github.com/sigstore/cosign/v2/cmd/cosign@v2.6.5

      - name: enable the podman API socket
        run: |
          # syft and trivy read images through the podman API, not the
          # containers-storage files directly — rootless storage layouts are
          # version-coupled and syft's containers-storage parsing failed on the
          # runner. The socket is the supported interface.
          systemctl --user enable --now podman.socket
          podman info --format '{{.Host.RemoteSocket.Path}}' || true

      - name: SBOM
        run: |
          syft scan \
            "podman:localhost/base:${{ steps.meta.outputs.sha }}" \
            -o spdx-json=base.spdx.json -o cyclonedx-json=base.cdx.json

      - name: vulnerability scan
        run: |
          # Report, do not fail the build: a base-image CVE with no upstream fix
          # must be visible without blocking every unrelated change. The
          # scheduled rebuild is what actually resolves them.
          grype sbom:base.cdx.json -o table --fail-on '' || true

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: base-sbom-${{ steps.meta.outputs.arch }}
          path: base.*.json
          retention-days: 30

      # --- publish per-architecture ------------------------------------------
      # Always sha+arch tagged. The human-facing semver ladder is applied by the
      # `publish` job once BOTH architectures exist — pushing `:1.0.1` from one
      # arch would leave half the world with a broken pull.
      - name: push arch image
        id: push
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref_type == 'tag' || inputs.push_image || inputs.release_version != '')
        run: |
          set -euo pipefail
          dest="${{ steps.meta.outputs.repo }}"
          ref="$dest:${{ steps.meta.outputs.sha }}-${{ steps.meta.outputs.arch }}"
          podman tag "localhost/base:${{ steps.meta.outputs.sha }}" "$ref"
          podman push "$ref"
          echo "digest=$(podman inspect --format '{{index .RepoDigests 0}}' "$ref")" >> "$GITHUB_OUTPUT"

      - name: sign (keyless)
        if: steps.push.outcome == 'success'
        run: |
          # Keyless: the signature is bound to this workflow's OIDC identity, so
          # there is no signing key to store, rotate or leak.
          #
          # Sigstore's public Rekor instance is shared and rate-limited; cosign
          # retries a single POST internally but can still give up on a plain
          # transient blip. Retry the whole call too — signing the same digest
          # twice is harmless (it just adds another transparency-log entry).
          retry() {
            local attempt=1 max=4 delay=15
            until "$@"; do
              [ "$attempt" -ge "$max" ] && return 1
              echo "::warning::attempt ${attempt}/${max} failed — retrying in ${delay}s: $*"
              sleep "$delay"
              attempt=$((attempt + 1))
              delay=$((delay * 2))
            done
          }
          export COSIGN_EXPERIMENTAL=1
          retry cosign sign --yes "${{ steps.push.outputs.digest }}"

  # ---------------------------------------------------------------------------
  # Multi-arch manifest, plus the semver ladder and release for a `base-v*` tag.
  # ---------------------------------------------------------------------------
  publish:
    name: manifest and tags
    needs: build
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref_type == 'tag' || inputs.push_image || inputs.release_version != '')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write        # a `base-v*` tag also cuts a GitHub release
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - uses: ./.github/actions/go-tools
        with:
          tools: github.com/sigstore/cosign/v2/cmd/cosign@v2.6.5

      - name: assemble the manifest list
        id: manifest
        run: |
          set -euo pipefail
          sha="$(git rev-parse --short HEAD)"
          dest="$(.github/scripts/image-ref.sh base-repo)"
          # Dual login — see the build job's login step for why cosign needs
          # the docker keychain while podman/skopeo use containers/auth.json.
          echo "${{ secrets.GITHUB_TOKEN }}" | podman login "$REGISTRY" -u "${{ github.actor }}" --password-stdin
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login "$REGISTRY" -u "${{ github.actor }}" --password-stdin

          podman manifest create localhost/base-manifest
          # One arch today — see the matrix comment in the build job. The loop
          # stays so re-adding arm64 is a one-line change in both places.
          for arch in linux-amd64; do
            podman manifest add localhost/base-manifest "docker://$dest:$sha-$arch"
          done
          # The sha tag is this build's immutable identity, published always.
          podman manifest push --all localhost/base-manifest "docker://$dest:$sha"
          {
            echo "dest=$dest"
            echo "sha=$sha"
          } >> "$GITHUB_OUTPUT"

      # A "release" is a base-v* tag push OR a dispatch carrying
      # release_version. The dispatch path exists so a release can be cut from
      # an environment that can call the Actions API but cannot push tags; it
      # produces the identical artefacts, and the GitHub-release step below
      # creates the same base-v* git tag the push path starts from.
      - name: resolve release intent
        id: intent
        env:
          RELEASE_INPUT: ${{ inputs.release_version }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE}" = tag ]; then
            version="${GITHUB_REF_NAME#base-v}"
          else
            version="${RELEASE_INPUT}"
          fi
          if [ -n "$version" ] && ! printf '%s' "$version" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::'${version}' is not a bare MAJOR.MINOR.PATCH version"
            exit 1
          fi
          {
            echo "version=${version}"
            echo "release=$([ -n "$version" ] && echo true || echo false)"
          } >> "$GITHUB_OUTPUT"

      - name: publish :edge (non-release builds)
        if: steps.intent.outputs.release != 'true'
        run: |
          # `edge` is the tip of main: built and smoke-tested, but not a release.
          # versions.yaml is never allowed to point at it.
          podman manifest push --all localhost/base-manifest \
            "docker://${{ steps.manifest.outputs.dest }}:edge"

      - name: publish the semver ladder
        id: release
        if: steps.intent.outputs.release == 'true'
        run: |
          set -euo pipefail
          version="${{ steps.intent.outputs.version }}"
          dest="${{ steps.manifest.outputs.dest }}"
          # A consumer picks the precision they want to be surprised at:
          # :1.0.1 never moves, :1.0 tracks OS patches, :1 tracks minors.
          for t in "$version" "${version%.*}" "${version%%.*}" latest; do
            podman manifest push --all localhost/base-manifest "docker://$dest:$t"
            echo "pushed $dest:$t"
          done
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: sign the release
        if: steps.intent.outputs.release == 'true'
        run: |
          set -euo pipefail
          dest="${{ steps.manifest.outputs.dest }}"
          version="${{ steps.release.outputs.version }}"
          # Sign by digest, never by tag: a tag can be moved, and a signature
          # over a movable name certifies nothing.
          digest="$(skopeo inspect --format '{{.Digest}}' "docker://$dest:$version" 2>/dev/null || true)"
          if [ -z "$digest" ]; then
            echo "::warning::could not resolve a digest for $dest:$version — not signing a mutable tag"
            exit 0
          fi
          # Sigstore's public Rekor instance is shared and rate-limited; cosign
          # retries a single POST internally but can still give up on a plain
          # transient blip. Retry the whole call too — signing the same digest
          # twice is harmless (it just adds another transparency-log entry).
          retry() {
            local attempt=1 max=4 delay=15
            until "$@"; do
              [ "$attempt" -ge "$max" ] && return 1
              echo "::warning::attempt ${attempt}/${max} failed — retrying in ${delay}s: $*"
              sleep "$delay"
              attempt=$((attempt + 1))
              delay=$((delay * 2))
            done
          }
          export COSIGN_EXPERIMENTAL=1
          retry cosign sign --yes "${dest}@${digest}"

      - name: GitHub release
        if: steps.intent.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="${{ steps.release.outputs.version }}"
          dest="${{ steps.manifest.outputs.dest }}"
          notes="$(mktemp)"
          {
            echo "## Base image \`${version}\`"
            echo
            echo "The DevBox foundation: Ubuntu 24.04 LTS, non-root \`dev\` user,"
            echo "Go / Node / Python + uv, shell profile. linux/amd64."
            echo
            echo '```'
            echo "podman pull ${dest}:${version}"
            echo '```'
            echo
            echo "### Adopting this base"
            echo
            echo "Set \`release.base\` in \`versions.yaml\` to \`${version}\` and open a PR."
            echo "build-devbox then rebuilds the DevBox on it and runs the full test"
            echo "suite before anything ships — that gate is the point of the pin."
            echo
            echo "Tags published: \`${version}\`, \`${version%.*}\`, \`${version%%.*}\`, \`latest\`"
          } > "$notes"
          # --target creates the base-v* tag at this commit when it does not
          # exist yet (the dispatch-release path); on a tag push the tag exists
          # and --target is ignored. Never --verify-tag: it would make the
          # dispatch path impossible, and the tag this creates IS the release
          # tag the push path starts from.
          gh release create "base-v${version}" \
            --title "Base image ${version}" \
            --notes-file "$notes" \
            --target "${GITHUB_SHA}"
