---
# =============================================================================
# Scheduled deep security scan.
# =============================================================================
# Separate from ci.yml because these checks are slow and, critically, because a
# NEW CVE against an UNCHANGED image is a thing that must be discovered on a
# schedule. CI only ever tells you about the code you just wrote.
name: security

"on":
  schedule:
    - cron: '0 4 * * *'          # daily
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'versions.yaml'
      - 'Containerfile*'
      - '.github/workflows/security.yml'

permissions:
  contents: read

defaults:
  run:
    shell: bash            # bash -eo pipefail; the default `bash -e` has no pipefail

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: false

jobs:

  image-vulnerabilities:
    name: published image CVEs
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        image:
          # Only the DevBox image — the base is scanned weekly by its own
          # repository (the Base Image Factory, droderiquesit/base-image-factory).
          - ghcr.io/${{ github.repository }}:latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: ./.github/actions/trivy

      - name: trivy
        run: |
          trivy image "${{ matrix.image }}" \
            --format sarif --output trivy.sarif \
            --severity HIGH,CRITICAL --ignore-unfixed --exit-code 0
        continue-on-error: true      # the image may not be published yet

      - uses: github/codeql-action/upload-sarif@4e828ff8d448a8a6e532957b1811f387a63867e8 # v3.29.4
        if: hashFiles('trivy.sarif') != ''
        # Code scanning may not be enabled — it is a paid feature on private
        # repositories. Trivy still ran and the SARIF is still produced; there
        # is simply nowhere to put it. Failing the whole security job over a
        # missing *destination* would train people to ignore this job, so the
        # upload is best-effort and the SARIF is always kept as an artifact.
        continue-on-error: true
        with:
          sarif_file: trivy.sarif
          category: trivy-${{ strategy.job-index }}

      - name: keep the SARIF regardless
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always() && hashFiles('trivy.sarif') != ''
        with:
          name: trivy-sarif-${{ strategy.job-index }}
          path: trivy.sarif
          retention-days: 30

  repository:
    name: repository scan
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - uses: ./.github/actions/go-tools
        with:
          tools: github.com/zricethezav/gitleaks/v8@v8.30.1

      - name: gitleaks (full history)
        run: |
          # Known historical findings, and their remediation status, are listed
          # in .gitleaksignore. Those fingerprints are commit-scoped, so a new
          # leak — including the same secret reintroduced later — still fails.
          gitleaks git . --redact --verbose

      - name: semgrep
        run: |
          pipx install semgrep==1.145.0
          semgrep scan --config p/ci --sarif --output semgrep.sarif --metrics=off . || true

      - uses: github/codeql-action/upload-sarif@4e828ff8d448a8a6e532957b1811f387a63867e8 # v3.29.4
        if: hashFiles('semgrep.sarif') != ''
        # Same reasoning as the trivy upload above, which already had this and
        # this one was missing: code scanning is a paid feature on private
        # repositories, so the upload fails with "Resource not accessible by
        # integration". Semgrep still ran and the SARIF still exists; there is
        # simply nowhere to put it. Failing the security job over a missing
        # *destination* teaches people to ignore a red security job, which is
        # far more dangerous than an unpublished report.
        continue-on-error: true
        with:
          sarif_file: semgrep.sarif
          category: semgrep

  policy:
    name: policy conformance
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: ./.github/actions/go-tools
        with:
          tools: >-
            github.com/open-policy-agent/conftest@v0.69.0
            github.com/open-policy-agent/opa@v1.19.0

      - name: Rego unit tests
        run: opa test security/policy -v

      - name: Containerfiles conform to the image policy
        run: |
          # The image policy asserts the things §31 requires: non-root user,
          # pinned base, no embedded secrets, explicit healthcheck.
          #
          # --parser dockerfile is REQUIRED, not decoration: conftest picks a
          # parser from the file extension, and this file is called
          # `Containerfile`, which matches nothing it knows. Without the flag
          # it exits 1 with "unknown parser: , path: Containerfile" — so this
          # policy had never actually evaluated. The rules expect the
          # dockerfile parser's shape (input[i].Cmd), which is what this
          # selects.
          conftest test --parser dockerfile --policy security/policy/container Containerfile

      - name: MCP registry conforms to the MCP policy
        run: |
          conftest test --policy security/policy/mcp mcp/servers.yaml

  supply-chain:
    name: supply chain
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: ./.github/actions/go-tools
        with:
          tools: github.com/sigstore/cosign/v2/cmd/cosign@v2.6.5

      - name: verify every third-party action is pinned to a commit SHA
        run: |
          set -euo pipefail
          unpinned=$(grep -rhoE 'uses:[[:space:]]*[A-Za-z0-9._-]+/[A-Za-z0-9._-]+@[A-Za-z0-9._/-]+' \
                     .github/workflows .github/actions | grep -vE '@[0-9a-f]{40}$' || true)
          if [ -n "$unpinned" ]; then
            echo "::error::third-party actions pinned to mutable tags:"
            printf '%s\n' "$unpinned"
            exit 1
          fi
          echo "all third-party actions are pinned to commit SHAs"

      - name: verify image signatures
        run: |
          COSIGN_EXPERIMENTAL=1 cosign verify \
            --certificate-identity-regexp "https://github.com/${{ github.repository }}/.*" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "ghcr.io/${{ github.repository }}:latest" \
            || echo "::warning::image signature not yet available (expected before the first publish)"
