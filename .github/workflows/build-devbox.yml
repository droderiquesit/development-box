---
# =============================================================================
# DEVBOX image — build on the published external base, test, publish.
# =============================================================================
# This is the image that changes weekly. It builds FROM a PUBLISHED release of
# the Base Image Factory's ai-engineering image — the repo/version/digest
# pinned in the `base:` section of versions.yaml — and never builds a base of
# its own. The base's entire lifecycle (build, harden, test, scan, sign,
# version) belongs to the factory repository (droderiquesit/ai-devbox); this
# repository consumes it exactly the way any third project could.
#
# That is a deliberate constraint, and it buys three things:
#
#   * Speed. A tool bump costs minutes, not the 25 minutes a base rebuild adds.
#   * Reproducibility. Every DevBox built from base 1.0.0 has an identical
#     foundation, whichever runner, month or branch produced it.
#   * A patching mechanism. Bumping the `base:` pin is a one-line, reviewable,
#     revertable commit, and this workflow's full test suite is the gate that
#     the new base has to pass before it reaches anyone.
name: build-devbox

"on":
  push:
    branches: [main, develop]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - '.vscode/**'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  schedule:
    # Weekly: picks up new CVE fixes in the pinned tools and refreshes the
    # channel-pinned AI CLIs, which ship several releases per week.
    - cron: '0 6 * * 1'
  workflow_dispatch:
    inputs:
      push_image:
        description: Push to the registry
        type: boolean
        default: false
      features:
        description: 'Extra build args, e.g. "FEATURE_CLOUD_AWS=1 FEATURE_CLOUD_AZURE=1"'
        type: string
        default: ''

permissions:
  contents: read

defaults:
  run:
    shell: bash            # bash -eo pipefail; the default `bash -e` has no pipefail

env:
  REGISTRY: ghcr.io
  CACHE_REPO: ghcr.io/${{ github.repository }}/buildcache

# Queue, never cancel. Since base-image-update.yml started dispatching this
# pipeline after every pin commit, a run on main may be the one that publishes
# the DevBox for a freshly adopted base — cancelling it in favour of a newer
# event could leave the pin pointing at a base whose DevBox was never built,
# tested or published. Runs on the same ref wait their turn instead; the later
# run rebuilds from the later commit and simply supersedes the earlier result.
concurrency:
  group: build-devbox-${{ github.ref }}
  cancel-in-progress: false

jobs:

  build:
    name: build and test
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
      id-token: write
      security-events: write

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: metadata
        id: meta
        run: |
          set -euo pipefail
          {
            echo "sha=$(git rev-parse --short HEAD)"
            echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "version=$(.github/scripts/image-ref.sh devbox-version)"
            echo "repo=$(.github/scripts/image-ref.sh devbox-repo)"
            echo "base=$(.github/scripts/image-ref.sh base)"
          } >> "$GITHUB_OUTPUT"

      - name: log in to the registry
        run: |
          # Both keychains, deliberately: podman writes containers/auth.json,
          # which podman and skopeo read — but cosign uses go-containerregistry,
          # which reads the DOCKER keychain (~/.docker/config.json). With only
          # podman login, the push succeeds and the signing step then fails
          # UNAUTHORIZED on the very image that was just pushed.
          echo "${{ secrets.GITHUB_TOKEN }}" | \
            podman login "$REGISTRY" -u "${{ github.actor }}" --password-stdin
          echo "${{ secrets.GITHUB_TOKEN }}" | \
            docker login "$REGISTRY" -u "${{ github.actor }}" --password-stdin

      - name: reclaim runner disk
        run: |
          # The hosted runner's root filesystem has ~14 GB free — not enough for
          # a 10.5 GB image plus the layer copies containers/storage stages in
          # /var/tmp while committing (the build died there at the 70-ai layer).
          # The preinstalled toolchains this job never touches are the biggest
          # things on the disk; removing them frees ~25-30 GB.
          before="$(df -h / | awk 'NR==2{print $4}')"
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/.ghcup /opt/hostedtoolcache/CodeQL \
                      /usr/local/share/powershell /usr/share/swift \
                      /usr/local/share/chromium /opt/microsoft
          echo "free space: ${before} -> $(df -h / | awk 'NR==2{print $4}')"

      # -----------------------------------------------------------------------
      # Resolve the base. Pull the pinned external release; never build one.
      # -----------------------------------------------------------------------
      - name: resolve the base image
        id: base
        run: |
          set -euo pipefail
          pinned='${{ steps.meta.outputs.base }}'

          if podman pull "$pinned"; then
            # Record the digest, not just the tag. A tag tells you what was
            # asked for; the digest tells you what was actually used, which is
            # the only thing worth putting in an image label.
            digest="$(podman image inspect --format '{{index .RepoDigests 0}}' "$pinned")"
            {
              echo "ref=$pinned"
              echo "digest=$digest"
            } >> "$GITHUB_OUTPUT"
            echo "::notice::building on published base ${pinned} (${digest})"
            exit 0
          fi

          # A missing base is a real error on EVERY event, PRs included. The
          # base is an external dependency owned by the Base Image Factory
          # (droderiquesit/ai-devbox); no change in THIS repository can create
          # the release it's missing, so there is nothing a throwaway local
          # build would be standing in for — it would only produce a DevBox
          # whose foundation nobody reviewed, tested or signed, looking
          # identical to a correct build.
          cat >&2 <<EOF
          ::error::base image ${pinned} is not available in the registry.

          versions.yaml pins base.version to $(.github/scripts/image-ref.sh base-version).
          Publish that release from the Base Image Factory repository
          (droderiquesit/ai-devbox — tag \`ai-engineering-v$(.github/scripts/image-ref.sh base-version)\`
          or its release_version dispatch), or correct the pin here. This
          build will not invent a base of its own.
          EOF
          exit 1

      - name: build
        env:
          CACHE_PUSH: ${{ (github.event_name != 'pull_request' && github.ref == 'refs/heads/main') && '1' || '0' }}
        run: |
          set -euo pipefail
          # shellcheck disable=SC2206  # deliberate word splitting of the input
          extra=(${{ inputs.features }})
          args=()
          for kv in "${extra[@]-}"; do [ -n "$kv" ] && args+=(--build-arg "$kv"); done
          # The resolve step's digest output is RepoDigests form (repo@sha256:…);
          # the OCI base.digest label wants the bare digest, so strip the repo.
          base_digest='${{ steps.base.outputs.digest }}'
          .github/scripts/podman-build.sh \
            Containerfile \
            "localhost/devbox:${{ steps.meta.outputs.sha }}" \
            --build-arg BASE_IMAGE_REF="${{ steps.base.outputs.ref }}" \
            --build-arg BASE_IMAGE_DIGEST="${base_digest##*@}" \
            --build-arg VCS_REF="${{ steps.meta.outputs.sha }}" \
            --build-arg BUILD_DATE="${{ steps.meta.outputs.date }}" \
            --build-arg VERSION="${{ steps.meta.outputs.version }}" \
            "${args[@]}"

      - name: test suite
        run: |
          ENGINE=podman \
          IMAGE="localhost/devbox:${{ steps.meta.outputs.sha }}" \
          BASE_IMAGE="${{ steps.base.outputs.ref }}" \
          tests/run.sh

      - name: image size report
        run: |
          podman images --format '{{.Repository}}:{{.Tag}}  {{.Size}}' \
            | grep -E 'devbox|base' || true

      - uses: ./.github/actions/go-tools
        with:
          tools: >-
            github.com/anchore/syft/cmd/syft@v1.51.0
            github.com/sigstore/cosign/v2/cmd/cosign@v2.6.5

      - name: enable the podman API socket
        run: |
          # syft and trivy read images through the podman API, not the
          # containers-storage files directly — rootless storage layouts are
          # version-coupled and syft's containers-storage parsing failed on the
          # runner. The socket is the supported interface.
          systemctl --user enable --now podman.socket
          podman info --format '{{.Host.RemoteSocket.Path}}' || true

      - name: SBOM
        run: |
          set -euo pipefail
          mkdir -p sbom
          syft scan \
            "podman:localhost/devbox:${{ steps.meta.outputs.sha }}" \
            -o spdx-json=sbom/devbox.spdx.json \
            -o cyclonedx-json=sbom/devbox.cdx.json
          echo "packages: $(jq '.packages | length' sbom/devbox.spdx.json)"

      - uses: ./.github/actions/trivy

      - name: vulnerability scan (SARIF)
        run: |
          # The image is in podman's local store, not a registry — read it
          # through the podman API socket enabled above.
          trivy image \
            --image-src podman \
            "localhost/devbox:${{ steps.meta.outputs.sha }}" \
            --format sarif --output trivy-image.sarif \
            --severity HIGH,CRITICAL --ignore-unfixed --exit-code 0

      - uses: github/codeql-action/upload-sarif@4e828ff8d448a8a6e532957b1811f387a63867e8 # v3.29.4
        # Only upload if a scan actually produced a file; `always()` on its own
        # turns one failure into two and buries the real error.
        if: always() && hashFiles('trivy-image.sarif') != ''
        # Code scanning may not be enabled — it is a paid feature on private
        # repositories. Trivy still ran and the SARIF is still produced; there
        # is simply nowhere to put it. Failing the whole security job over a
        # missing *destination* would train people to ignore this job, so the
        # upload is best-effort and the SARIF is always kept as an artifact.
        continue-on-error: true
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image

      - name: keep the SARIF regardless
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always() && hashFiles('trivy-image.sarif') != ''
        with:
          name: trivy-image-sarif
          path: trivy-image.sarif
          retention-days: 30

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: devbox-sbom
          path: sbom/
          retention-days: 90

      # --- publish -----------------------------------------------------------
      # Untagged builds publish :edge and :sha only. The semver ladder belongs
      # to release.yml, driven by a `v*` tag. A build that was never explicitly
      # released must never claim a version number.
      - name: push
        id: push
        # No throwaway-base guard needed any more: resolve-the-base either
        # pulled the published external release or failed the job outright.
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || inputs.push_image)
        run: |
          set -euo pipefail
          dest="${{ steps.meta.outputs.repo }}"
          for tag in "${{ steps.meta.outputs.sha }}" edge; do
            podman tag "localhost/devbox:${{ steps.meta.outputs.sha }}" "$dest:$tag"
            podman push "$dest:$tag"
          done
          echo "digest=$(podman inspect --format '{{index .RepoDigests 0}}' "$dest:${{ steps.meta.outputs.sha }}")" >> "$GITHUB_OUTPUT"

      - name: sign and attest the SBOM
        if: steps.push.outcome == 'success'
        run: |
          set -euo pipefail
          export COSIGN_EXPERIMENTAL=1
          # Sign the image, then attach the SBOM as a signed attestation. The
          # attestation is what makes the SBOM trustworthy rather than merely
          # present.
          #
          # Sigstore's public Rekor instance is a shared, rate-limited service;
          # cosign retries a single POST internally but can still give up on a
          # plain transient blip. Wrap the call in an outer retry too — signing
          # the same digest twice is harmless (it just adds another
          # transparency-log entry), so retrying from the top is safe.
          retry() {
            local attempt=1 max=4 delay=15
            until "$@"; do
              [ "$attempt" -ge "$max" ] && return 1
              echo "::warning::attempt ${attempt}/${max} failed — retrying in ${delay}s: $*"
              sleep "$delay"
              attempt=$((attempt + 1))
              delay=$((delay * 2))
            done
          }
          retry cosign sign --yes "${{ steps.push.outputs.digest }}"

          # `attest` hits a known, still-open upstream limitation: Rekor's
          # public instance rejects the in-toto attestation once the embedded
          # predicate (our full SPDX SBOM, multi-MB for an image this size)
          # makes the entry too large — confirmed 8/8 failures across two
          # release.yml v1.0.0 attempts, every one within ~1-2s of the POST
          # (too fast to be a slow-upload timeout).
          # https://github.com/sigstore/cosign/issues/3599
          #
          # --tlog-upload=false skips the public transparency-log entry for
          # THIS attestation only — the image signature above stays fully
          # Rekor-anchored. The SBOM attestation is still Fulcio-signed and
          # bound to this workflow's OIDC identity, but without a tlog entry
          # that cannot be re-proven once the ephemeral cert expires, so
          # `cosign verify-attestation` needs `--insecure-ignore-tlog` — see
          # docs/releases.md. Revisit once cosign/Rekor#3599 is resolved.
          retry cosign attest --yes --tlog-upload=false \
            --predicate sbom/devbox.spdx.json \
            --type spdxjson \
            "${{ steps.push.outputs.digest }}"

      - name: summary
        if: always()
        run: |
          {
            echo "### DevBox build"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| base image | \`${{ steps.base.outputs.ref }}\` |"
            echo "| base digest | \`${{ steps.base.outputs.digest }}\` |"
            echo "| devbox version | ${{ steps.meta.outputs.version }} |"
            echo "| commit | \`${{ steps.meta.outputs.sha }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
