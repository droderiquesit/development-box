---
# =============================================================================
# RELEASE — tag a DevBox version, publish signed images, attach the SBOM.
# =============================================================================
# Triggered by a `v*.*.*` tag. This releases the DEVBOX only; the base image
# is an external dependency with its own release stream in the Base Image
# Factory repository (droderiquesit/base-image-factory, `ai-engineering-v*` releases).
#
# This build does NOT build a base image. It pulls the base release pinned in
# the `base:` section of versions.yaml, exactly as build-devbox does. A
# release that quietly rebuilt its own base would ship a foundation that no
# test suite had ever seen, and would make "which base is DevBox 1.2.0 on?"
# unanswerable.
#
# Release checklist this encodes:
#   * the tag and versions.yaml must agree, or the build stops
#   * the pinned base must already exist in the registry
#   * the full image test suite runs before anything is pushed
#   * images are signed by digest and the SBOM is attached as an attestation
name: release

"on":
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag, e.g. v1.2.0'
        type: string
        required: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  REGISTRY: ghcr.io
  CACHE_REPO: ghcr.io/${{ github.repository }}/buildcache

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false      # never cancel a half-published release

jobs:

  release:
    name: build, sign and publish
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: write        # create the GitHub release
      packages: write
      id-token: write        # cosign keyless
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: resolve and verify the version
        id: v
        run: |
          set -euo pipefail
          tag="${{ inputs.tag || github.ref_name }}"
          version="${tag#v}"

          if ! printf '%s' "$version" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::tag ${tag} does not carry a bare MAJOR.MINOR.PATCH version"
            exit 1
          fi

          # The tag and the manifest must agree. If they can drift, then
          # `devbox info` inside the image and the tag people pulled will
          # disagree, and there is no way to tell which one lied.
          pinned="$(.github/scripts/image-ref.sh devbox-version)"
          if [ "$version" != "$pinned" ]; then
            echo "::error::tag ${tag} says ${version} but versions.yaml release.devbox says ${pinned}. Update versions.yaml and re-tag."
            exit 1
          fi

          {
            echo "tag=$tag"
            echo "version=$version"
            echo "sha=$(git rev-parse --short HEAD)"
            echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "repo=$(.github/scripts/image-ref.sh devbox-repo)"
            echo "base=$(.github/scripts/image-ref.sh base)"
            echo "base_version=$(.github/scripts/image-ref.sh base-version)"
          } >> "$GITHUB_OUTPUT"

      - name: log in to the registry
        run: |
          # Both keychains, deliberately: podman writes containers/auth.json,
          # which podman and skopeo read — but cosign uses go-containerregistry,
          # which reads the DOCKER keychain (~/.docker/config.json). With only
          # podman login, the push succeeds and the signing step then fails
          # UNAUTHORIZED on the very image that was just pushed.
          echo "${{ secrets.GITHUB_TOKEN }}" | \
            podman login "$REGISTRY" -u "${{ github.actor }}" --password-stdin
          echo "${{ secrets.GITHUB_TOKEN }}" | \
            docker login "$REGISTRY" -u "${{ github.actor }}" --password-stdin

      - name: reclaim runner disk
        run: |
          # The hosted runner's root filesystem has ~14 GB free — not enough for
          # a 10.5 GB image plus the layer copies containers/storage stages in
          # /var/tmp while committing (the build died there at the 70-ai layer).
          # The preinstalled toolchains this job never touches are the biggest
          # things on the disk; removing them frees ~25-30 GB.
          before="$(df -h / | awk 'NR==2{print $4}')"
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/.ghcup /opt/hostedtoolcache/CodeQL \
                      /usr/local/share/powershell /usr/share/swift \
                      /usr/local/share/chromium /opt/microsoft
          echo "free space: ${before} -> $(df -h / | awk 'NR==2{print $4}')"

      - name: pull the pinned base image
        id: base
        run: |
          set -euo pipefail
          base='${{ steps.v.outputs.base }}'
          if ! podman pull "$base"; then
            echo "::error::pinned base ${base} is not in the registry. Publish it from the Base Image Factory (droderiquesit/base-image-factory, release ai-engineering-v${{ steps.v.outputs.base_version }}) before releasing the DevBox."
            exit 1
          fi
          echo "digest=$(podman image inspect --format '{{index .RepoDigests 0}}' "$base")" >> "$GITHUB_OUTPUT"

      - name: build
        env:
          CACHE_PUSH: '1'
        run: |
          .github/scripts/podman-build.sh \
            Containerfile \
            "localhost/devbox:${{ steps.v.outputs.version }}" \
            --build-arg BASE_IMAGE_REF="${{ steps.v.outputs.base }}" \
            --build-arg VCS_REF="${{ steps.v.outputs.sha }}" \
            --build-arg BUILD_DATE="${{ steps.v.outputs.date }}" \
            --build-arg VERSION="${{ steps.v.outputs.version }}"

      - name: test suite
        run: |
          # A release is the one build that absolutely must not skip this.
          ENGINE=podman \
          IMAGE="localhost/devbox:${{ steps.v.outputs.version }}" \
          BASE_IMAGE="${{ steps.v.outputs.base }}" \
          tests/run.sh

      - uses: ./.github/actions/go-tools
        with:
          tools: >-
            github.com/anchore/syft/cmd/syft@v1.51.0
            github.com/anchore/grype/cmd/grype@v0.117.0
            github.com/sigstore/cosign/v2/cmd/cosign@v2.6.5

      - name: enable the podman API socket
        run: |
          # syft and trivy read images through the podman API, not the
          # containers-storage files directly — rootless storage layouts are
          # version-coupled and syft's containers-storage parsing failed on the
          # runner. The socket is the supported interface.
          systemctl --user enable --now podman.socket
          podman info --format '{{.Host.RemoteSocket.Path}}' || true

      - name: SBOM
        run: |
          set -euo pipefail
          mkdir -p sbom
          syft scan "podman:localhost/devbox:${{ steps.v.outputs.version }}" \
            -o spdx-json=sbom/devbox-${{ steps.v.outputs.version }}.spdx.json \
            -o cyclonedx-json=sbom/devbox-${{ steps.v.outputs.version }}.cdx.json

      - name: vulnerability report
        run: |
          # Recorded in the release notes rather than used as a gate: a release
          # blocked by an unfixable upstream CVE helps nobody, but shipping one
          # silently is worse.
          grype "sbom:sbom/devbox-${{ steps.v.outputs.version }}.cdx.json" \
            -o table --fail-on '' | tee grype.txt || true

      - name: publish the semver ladder
        id: publish
        run: |
          .github/scripts/publish-image.sh \
            "localhost/devbox:${{ steps.v.outputs.version }}" \
            "${{ steps.v.outputs.repo }}" \
            "${{ steps.v.outputs.version }}"

      - name: sign and attest
        run: |
          set -euo pipefail
          export COSIGN_EXPERIMENTAL=1
          # Sigstore's public Rekor instance is a shared, rate-limited service;
          # cosign already retries a single POST a few times internally, but a
          # v1.0.0 release watched it give up after 4 attempts on a plain
          # transient blip. Wrap the whole call in an outer retry too — signing
          # the same digest twice is harmless (it just adds another
          # transparency-log entry), so retrying from the top is safe.
          retry() {
            local attempt=1 max=4 delay=15
            until "$@"; do
              [ "$attempt" -ge "$max" ] && return 1
              echo "::warning::attempt ${attempt}/${max} failed — retrying in ${delay}s: $*"
              sleep "$delay"
              attempt=$((attempt + 1))
              delay=$((delay * 2))
            done
          }
          # By digest — a signature over a movable tag certifies nothing.
          retry cosign sign --yes "${{ steps.publish.outputs.digest }}"

          # The retry above fixed a real but occasional Rekor blip on `sign`.
          # `attest` failed 8/8 times across two full release attempts (v1.0.0
          # #3 and #4), every attempt failing within ~1-2s of the same POST —
          # too fast to be a slow-upload timeout, and it is a known, still-open
          # upstream limitation: Rekor's public instance rejects the in-toto
          # attestation once the embedded predicate (our full SPDX SBOM, which
          # is multi-MB for an image this size) makes the entry too large.
          # https://github.com/sigstore/cosign/issues/3599
          #
          # --tlog-upload=false skips the public transparency-log entry for
          # THIS attestation only — the image signature above stays fully
          # Rekor-anchored and durably verifiable. The SBOM attestation is
          # still Fulcio-signed and bound to this workflow's OIDC identity, but
          # without a tlog entry that binding cannot be re-proven once the
          # ephemeral signing certificate expires (~10 minutes), so
          # `cosign verify-attestation` needs `--insecure-ignore-tlog` — see
          # docs/releases.md. Revisit once cosign/Rekor#3599 is resolved
          # upstream.
          retry cosign attest --yes --tlog-upload=false \
            --predicate "sbom/devbox-${{ steps.v.outputs.version }}.spdx.json" \
            --type spdxjson \
            "${{ steps.publish.outputs.digest }}"

      - name: GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          v="${{ steps.v.outputs.version }}"
          repo="${{ steps.v.outputs.repo }}"
          notes="$(mktemp)"
          {
            echo "## AI Engineering DevBox \`${v}\`"
            echo
            echo '```'
            echo "podman pull ${repo}:${v}"
            echo '```'
            echo
            echo "### Provenance"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| image digest | \`${{ steps.publish.outputs.digest }}\` |"
            echo "| base image | \`${{ steps.v.outputs.base }}\` |"
            echo "| base digest | \`${{ steps.base.outputs.digest }}\` |"
            echo "| commit | \`${{ steps.v.outputs.sha }}\` |"
            echo
            echo "Signed with cosign (keyless, bound to this workflow's OIDC identity)."
            echo "The SPDX SBOM is attached as a signed attestation. Verify with:"
            echo
            echo '```'
            echo "cosign verify ${repo}:${v} \\"
            echo "  --certificate-identity-regexp 'https://github.com/${GITHUB_REPOSITORY}/' \\"
            echo "  --certificate-oidc-issuer https://token.actions.githubusercontent.com"
            echo '```'
            echo
            echo "### Tags published"
            echo
            echo "\`${v}\`, \`${v%.*}\`, \`${v%%.*}\`, \`latest\`"
            echo
            if [ -s grype.txt ]; then
              echo "<details><summary>Vulnerability report</summary>"
              echo
              echo '```'
              head -60 grype.txt
              echo '```'
              echo
              echo "</details>"
            fi
          } > "$notes"

          # --target creates the tag at the released commit when dispatch ran
          # without one; on a tag push the tag exists and --target is ignored.
          gh release create "${{ steps.v.outputs.tag }}" \
            --title "DevBox ${v}" \
            --notes-file "$notes" \
            --target "${GITHUB_SHA}" \
            "sbom/devbox-${v}.spdx.json" \
            "sbom/devbox-${v}.cdx.json"
