---
# =============================================================================
# Release — tag a version, publish signed images, attach the SBOM.
# =============================================================================
name: release

"on":
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag, e.g. v1.2.0'
        type: string
        required: true

permissions:
  contents: read

env:
  REGISTRY: ghcr.io

jobs:

  release:
    name: build, sign and publish
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: write        # create the GitHub release
      packages: write
      id-token: write        # cosign keyless
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: resolve the version
        id: v
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          {
            echo "tag=$tag"
            echo "sha=$(git rev-parse --short HEAD)"
            echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_OUTPUT"

      - name: build both images
        run: |
          set -euo pipefail
          base="$REGISTRY/${GITHUB_REPOSITORY,,}-base:${{ steps.v.outputs.tag }}"
          devbox="$REGISTRY/${GITHUB_REPOSITORY,,}:${{ steps.v.outputs.tag }}"
          common=(--build-arg "VCS_REF=${{ steps.v.outputs.sha }}"
                  --build-arg "BUILD_DATE=${{ steps.v.outputs.date }}"
                  --build-arg "VERSION=${{ steps.v.outputs.tag }}")
          podman build -f Containerfile.base -t "$base" "${common[@]}" .
          podman build -f Containerfile -t "$devbox" --build-arg "BASE_IMAGE_REF=$base" "${common[@]}" .
          {
            echo "BASE_REF=$base"
            echo "DEVBOX_REF=$devbox"
          } >> "$GITHUB_ENV"

      - name: test
        run: ENGINE=podman IMAGE="$DEVBOX_REF" BASE_IMAGE="$BASE_REF" tests/run.sh

      - name: SBOMs
        run: |
          go install github.com/anchore/syft/cmd/syft@v1.51.0
          syft="$(go env GOPATH)/bin/syft"
          mkdir -p dist
          "$syft" scan "containers-storage:$BASE_REF"   -o spdx-json=dist/base.spdx.json   -o cyclonedx-json=dist/base.cdx.json
          "$syft" scan "containers-storage:$DEVBOX_REF" -o spdx-json=dist/devbox.spdx.json -o cyclonedx-json=dist/devbox.cdx.json

      - name: vulnerability gate
        run: |
          go install github.com/anchore/grype/cmd/grype@v0.117.0
          # A release IS gated on critical, fixable vulnerabilities. Shipping a
          # tagged version with a known fixable critical is not acceptable;
          # unfixed ones are reported and do not block.
          "$(go env GOPATH)/bin/grype" sbom:dist/devbox.cdx.json \
            --only-fixed --fail-on critical -o table

      - name: publish
        run: |
          set -euo pipefail
          echo "${{ secrets.GITHUB_TOKEN }}" | podman login "$REGISTRY" -u "${{ github.actor }}" --password-stdin
          podman push "$BASE_REF"
          podman push "$DEVBOX_REF"
          podman tag "$DEVBOX_REF" "$REGISTRY/${GITHUB_REPOSITORY,,}:latest"
          podman push "$REGISTRY/${GITHUB_REPOSITORY,,}:latest"
          {
            echo "BASE_DIGEST=$(podman inspect --format '{{index .RepoDigests 0}}' "$BASE_REF")"
            echo "DEVBOX_DIGEST=$(podman inspect --format '{{index .RepoDigests 0}}' "$DEVBOX_REF")"
          } >> "$GITHUB_ENV"

      - name: sign and attest
        run: |
          set -euo pipefail
          go install github.com/sigstore/cosign/v2/cmd/cosign@v2.6.5
          cosign="$(go env GOPATH)/bin/cosign"
          export COSIGN_EXPERIMENTAL=1
          "$cosign" sign --yes "$BASE_DIGEST"
          "$cosign" sign --yes "$DEVBOX_DIGEST"
          "$cosign" attest --yes --predicate dist/devbox.spdx.json --type spdxjson "$DEVBOX_DIGEST"
          "$cosign" attest --yes --predicate dist/base.spdx.json   --type spdxjson "$BASE_DIGEST"

      - name: release notes
        run: |
          {
            echo "## AI Engineering DevBox ${{ steps.v.outputs.tag }}"
            echo
            echo "### Images"
            echo '```'
            echo "podman pull $DEVBOX_REF"
            echo "podman pull $BASE_REF"
            echo '```'
            echo
            echo "Digests:"
            echo '```'
            echo "$DEVBOX_DIGEST"
            echo "$BASE_DIGEST"
            echo '```'
            echo
            echo "### Verify the signature"
            echo '```bash'
            echo "cosign verify \\"
            echo "  --certificate-identity-regexp 'https://github.com/${GITHUB_REPOSITORY}/.*' \\"
            echo "  --certificate-oidc-issuer https://token.actions.githubusercontent.com \\"
            echo "  $DEVBOX_REF"
            echo '```'
            echo
            echo "### Pinned tool versions"
            echo '```yaml'
            sed -n '/^languages:/,/^$/p;/^iac:/,/^$/p;/^kubernetes:/,/^$/p' versions.yaml
            echo '```'
            echo
            echo "SBOMs (SPDX + CycloneDX) are attached to this release and also"
            echo "published as signed cosign attestations on the images."
          } > dist/RELEASE_NOTES.md

      - uses: softprops/action-gh-release@72f2c25fcb47643c292f7107632f7a47c1df5cd8 # v2.3.2
        with:
          tag_name: ${{ steps.v.outputs.tag }}
          body_path: dist/RELEASE_NOTES.md
          files: |
            dist/*.spdx.json
            dist/*.cdx.json
          generate_release_notes: true
