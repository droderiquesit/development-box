<a href="/runs/{{ r.id }}" class="card block transition hover:border-indigo-300 dark:hover:border-indigo-700">
  <div class="flex items-start gap-3">
    <div class="min-w-0 flex-1">
      <div class="truncate font-medium">{{ r.repo }}</div>
      <div class="text-xs text-slate-500">{{ r.base_branch }} &middot; {{ r.created_at.strftime("%b %d %H:%M") }} &middot; {{ r.created_by }}</div>
    </div>
    <span class="pill pill-{{ tone(r.status) }}">{{ r.status|label }}</span>
  </div>
  <div class="mt-3 flex items-center gap-3">
    <progress class="bar" max="100" value="{{ r.progress.percent }}">{{ r.progress.percent }}%</progress>
    <span class="shrink-0 text-xs tabular-nums text-slate-500">{{ r.progress.done }}/{{ r.progress.total }}</span>
  </div>
</a>
