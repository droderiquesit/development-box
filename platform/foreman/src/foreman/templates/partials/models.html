<section id="models" class="card" hx-get="/partials/models" hx-trigger="models-changed from:body delay:1s, every 30s" hx-swap="outerHTML">
  <div class="flex items-baseline justify-between">
    <h2 class="card-title">GPU models</h2>
    <span class="text-xs text-slate-500">billed per hour while running</span>
  </div>
  <ul class="mt-3 divide-y divide-slate-200 dark:divide-slate-800">
    {% for vm in models %}
    <li class="flex flex-wrap items-center gap-3 py-3" data-model="{{ vm.name }}">
      <div class="min-w-0 flex-1">
        <div class="font-medium capitalize">{{ vm.name }}</div>
        <div class="truncate text-xs text-slate-500">{{ vm.instance }} &middot; ${{ "%.2f"|format(vm.cost_per_hour) }}/hour while running</div>
      </div>
      <span class="pill {{ 'pill-ok' if vm.running else 'pill-muted' }}">{{ vm.status|lower }}</span>
      {% if vm.running %}
      <button class="btn btn-secondary" hx-post="/api/models/{{ vm.name }}/stop" hx-swap="none">Stop</button>
      {% else %}
      <button class="btn btn-primary" hx-post="/api/models/{{ vm.name }}/start" hx-swap="none"
              hx-confirm="Start {{ vm.name }}? It costs ${{ '%.2f'|format(vm.cost_per_hour) }}/hour until stopped.">Start</button>
      {% endif %}
    </li>
    {% endfor %}
  </ul>
</section>
