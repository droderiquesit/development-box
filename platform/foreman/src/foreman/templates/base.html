<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#4f46e5">
  <meta name="htmx-config" content='{"allowEval": false, "includeIndicatorStyles": false, "allowScriptTags": false, "selfRequestsOnly": true}'>
  <title>{% block title %}Foreman{% endblock %}</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/static/icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/static/icons/icon-192.png">
  <link rel="stylesheet" href="/static/css/app.css">
  <script nonce="{{ csp_nonce }}">
    (function () {
      var t = null;
      try { t = localStorage.getItem("foreman-theme"); } catch (e) {}
      if (t === "dark" || (t === null && window.matchMedia("(prefers-color-scheme: dark)").matches)) {
        document.documentElement.classList.add("dark");
      }
    })();
  </script>
  <script src="/static/app.js" defer></script>
  <script src="/static/vendor/htmx-2.0.11.min.js" defer></script>
  <script src="/static/vendor/alpinejs-csp-3.17.4.min.js" defer></script>
</head>
<body class="min-h-dvh bg-slate-50 text-slate-900 antialiased dark:bg-slate-950 dark:text-slate-100"
      hx-headers='{"X-CSRF-Token": "{{ csrf_token }}"}'>
  <header class="sticky top-0 z-20 border-b border-slate-200/70 bg-white/80 backdrop-blur dark:border-slate-800 dark:bg-slate-950/80">
    <nav class="mx-auto flex max-w-5xl items-center gap-3 px-4 py-3">
      <a href="/" class="flex items-center gap-2 font-semibold tracking-tight">
        <img src="/static/icons/icon.svg" alt="" class="h-7 w-7">
        <span>Foreman</span>
      </a>
      {% if mode == "local" %}<span class="pill pill-warn">local</span>{% endif %}
      <div class="ml-auto flex items-center gap-1">
        <a href="/runs/new" class="btn btn-primary">New blueprint</a>
        <a href="/settings" class="btn btn-ghost" aria-label="Settings">&#9881;</a>
        <button type="button" class="btn btn-ghost" x-data="theme" @click="toggle" aria-label="Toggle dark mode">&#9680;</button>
      </div>
    </nav>
  </header>
  <main class="mx-auto max-w-5xl px-4 pb-24 pt-5">
    {% block content %}{% endblock %}
  </main>
  <div id="toasts" class="fixed inset-x-0 bottom-4 z-30 flex flex-col items-center gap-2 px-4" aria-live="polite"></div>
  <footer class="mx-auto max-w-5xl px-4 pb-8 text-xs text-slate-500">Foreman {{ version }} &middot; signed in as {{ user }}</footer>
</body>
</html>
