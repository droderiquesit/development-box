[project]
name = "foreman"
version = "0.1.0"
description = "Control plane of the self-hosted autonomous development platform"
readme = "README.md"
authors = [
    { name = "David Roderiques", email = "droderiques@comcast.net" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.142.2",
    "google-auth==2.59.1",
    "google-cloud-compute==1.55.0",
    "google-cloud-firestore==2.34.0",
    "google-cloud-run==0.16.2",
    "httpx==0.28.1",
    "jinja2==3.1.6",
    "mcp==2.3.0",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "cryptography==50.0.2",
    "python-multipart==0.0.32",
    "requests==2.34.2",
    "uvicorn==0.54.0",
]

[project.scripts]
foreman = "foreman:main"

[build-system]
requires = ["uv_build>=0.11.14,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyright==1.1.414",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "ruff==0.16.10",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "BLE", "UP", "S", "ASYNC", "RUF", "SIM"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "S108"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
typeCheckingMode = "standard"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
