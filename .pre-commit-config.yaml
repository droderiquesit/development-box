# =============================================================================
# pre-commit — the local gate that mirrors CI
# =============================================================================
#   pre-commit install                 install the git hook
#   pre-commit run --all-files         run everything now
#   pre-commit run --hook-stage manual --all-files    include the slow hooks
#
# DESIGN RULE: the commit path must stay fast. Anything that takes more than a
# few seconds (full dependency scans, semgrep over a large tree, terraform
# validate that needs provider downloads) is marked `stages: [manual]` and runs
# in CI instead. A pre-commit hook that people routinely `--no-verify` past is
# worse than no hook, because it creates the illusion of a gate.
# =============================================================================

default_install_hook_types: [pre-commit, commit-msg]
fail_fast: false

repos:
  # ---------------------------------------------------------------- hygiene --
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--allow-multiple-documents]
        # GitHub Actions YAML uses expressions the strict parser rejects.
        exclude: ^\.github/workflows/
      - id: check-json
        exclude: ^\.(vscode|devcontainer)/   # these are JSONC, comments allowed
      - id: check-toml
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-symlinks
      - id: destroyed-symlinks
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable
      # The two that matter most:
      - id: detect-private-key
      - id: no-commit-to-branch
        args: [--branch, main, --branch, master, --branch, develop]

  # ---------------------------------------------------------------- secrets --
  # Fast, and the single highest-value hook in this file. A secret that reaches
  # a commit is compromised whether or not the commit is ever pushed.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  # -------------------------------------------------------------- terraform --
  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.100.1
    hooks:
      - id: terraform_fmt
      - id: terraform_tflint
        args: [--args=--only=terraform_deprecated_interpolation]
      - id: terraform_docs
        args: [--args=--output-file=README.md, --args=--output-mode=inject]
      # Slow: needs provider schemas, so it downloads on a cold cache.
      - id: terraform_validate
        stages: [manual]
      # Slow: full policy evaluation. CI runs it on every PR.
      - id: terraform_checkov
        args: [--args=--quiet, --args=--compact, --args=--skip-download]
        stages: [manual]

  # ------------------------------------------------------------------ shell --
  - repo: https://github.com/koalaman/shellcheck-precommit
    rev: v0.11.0
    hooks:
      - id: shellcheck
        args: [-x, -S, warning]

  - repo: https://github.com/scop/pre-commit-shfmt
    rev: v3.12.0-2
    hooks:
      - id: shfmt
        args: [-i, '2', -ci, -w]

  # ------------------------------------------------------------------- yaml --
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint
        args: [-c, config/tools/yamllint.yaml]

  # --------------------------------------------------------- github actions --
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint

  # ----------------------------------------------------------------- python --
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.3
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  # ---------------------------------------------------------------- markdown --
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.46.0
    hooks:
      - id: markdownlint
        args: [--disable, MD013, MD033, MD041, --]

  # ------------------------------------------------------------ commit msgs --
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args: [feat, fix, docs, style, refactor, perf, test, build, ci, chore, revert, security]

  # ------------------------------------------------------------- devbox own --
  - repo: local
    hooks:
      # The generated AI instruction files must never drift from the canonical
      # policy. This is the whole reason they are generated.
      - id: ai-sync-check
        name: AI instruction files are current
        entry: scripts/configure/render-ai-rules.sh --check
        language: script
        pass_filenames: false
        files: ^(ai/policies/policy\.yaml|CLAUDE\.md|AGENTS\.md|GEMINI\.md|\.github/copilot-instructions\.md|\.cursor/rules/.*)$

      - id: devbox-config-validate
        name: DevBox configuration is valid
        entry: tests/validate-config.sh
        language: script
        pass_filenames: false
        files: ^(versions\.yaml|ai/|mcp/|config/)

      # Slow but important: full security sweep, on demand and in CI.
      - id: devbox-security-scan
        name: DevBox security scan
        entry: scripts/security/scan.sh
        language: script
        pass_filenames: false
        stages: [manual]
