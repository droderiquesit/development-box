# =============================================================================
# AI ENGINEERING DEVBOX — compose stack
# =============================================================================
#   podman compose up -d                          the DevBox
#
# Works with `podman compose` (podman-compose or the Docker Compose v2 provider)
# and with `docker compose`. Nothing here requires Docker Desktop.
#
# ARCHITECTURE NOTE
#   The DevBox is one container and a CLIENT. Models run elsewhere: on GPUs in
#   your GCP project (infra/gcp-models, reached through IAP tunnels that
#   `ai up` opens) or on Ollama Cloud. Nothing here runs a model.
# =============================================================================

x-devbox-security: &devbox-security
  # Rootless by default. Inside a rootless container the container's uid maps to
  # an unprivileged host uid, so this is defence in depth, not the only boundary.
  security_opt:
    - no-new-privileges:true
    - label=disable          # remove if you run enforcing SELinux with a policy
  cap_drop:
    - ALL
  cap_add:
    # CHOWN/SETUID/SETGID are needed for `sudo` and for package installs inside
    # the box. Drop these too (and set FEATURE_SUDO=0 at build) for a locked-down
    # variant — see docs/security.md.
    - CHOWN
    - SETUID
    - SETGID
    - DAC_OVERRIDE

services:

  # ---------------------------------------------------------------------------
  # The DevBox itself. This is the container VS Code attaches to.
  # ---------------------------------------------------------------------------
  devbox:
    # Default to the PUBLISHED image: `docker compose up` should not cost 25
    # minutes of local build the first time someone tries this.
    #   published (default) : DEVBOX_IMAGE unset -> ghcr.io/<owner>/development-box:latest
    #   pin a release       : DEVBOX_IMAGE=ghcr.io/<owner>/development-box:1.0.0
    #   build locally       : docker compose build devbox   (or `make build`)
    # The build: block below is what `compose build` uses; it is not run on `up`
    # unless the image is missing locally AND cannot be pulled.
    build:
      context: .
      dockerfile: Containerfile
      args:
        # Same rule as CI: build FROM the published, pinned Base Image
        # Factory release rather than rebuilding it. Keep this in step with
        # the `base:` section of versions.yaml.
        BASE_IMAGE_REF: ${DEVBOX_BASE_IMAGE:-ghcr.io/droderiquesit/base-image-factory/ai-engineering:1.0.1}
        DEV_UID: ${DEV_UID:-1000}
        DEV_GID: ${DEV_GID:-1000}
        FEATURE_CLOUD_AWS: ${FEATURE_CLOUD_AWS:-0}
        FEATURE_CLOUD_AZURE: ${FEATURE_CLOUD_AZURE:-0}
        FEATURE_CLOUD_GCP: ${FEATURE_CLOUD_GCP:-1}
        FEATURE_K8S_LOCAL: ${FEATURE_K8S_LOCAL:-0}
        FEATURE_AI_GEMINI: ${FEATURE_AI_GEMINI:-1}
        FEATURE_AI_EXTRA: ${FEATURE_AI_EXTRA:-0}
        FEATURE_MCP_BROWSER: ${FEATURE_MCP_BROWSER:-0}
        FEATURE_MCP_KUBERNETES: ${FEATURE_MCP_KUBERNETES:-0}
    image: ${DEVBOX_IMAGE:-ghcr.io/droderiquesit/development-box:latest}
    container_name: ai-devbox
    hostname: devbox
    <<: *devbox-security
    user: "${DEV_UID:-1000}:${DEV_GID:-1000}"
    init: true
    stdin_open: true
    tty: true
    # Keeps the container alive for VS Code to attach to; the real work happens
    # in exec'd shells.
    command: ["sleep", "infinity"]

    volumes:
      # --- your code -------------------------------------------------------
      # :z relabels for SELinux (shared). On a non-SELinux host it is ignored.
      - ${DEVBOX_WORKSPACE_HOST:-./workspace}:/workspace:z

      # --- persistent developer state --------------------------------------
      # Named volumes, so destroying and rebuilding the container costs nothing.
      - devbox-config:/home/dev/.config
      - devbox-state:/home/dev/.local/state
      - devbox-share:/home/dev/.local/share
      - devbox-history:/home/dev/.bash_history.d

      # --- caches: the difference between a 4-second and a 4-minute init ----
      - tf-plugin-cache:/home/dev/.cache/terraform
      - go-cache:/home/dev/.cache/go
      - npm-cache:/home/dev/.cache/npm
      - uv-cache:/home/dev/.cache/uv
      - pip-cache:/home/dev/.cache/pip
      - helm-cache:/home/dev/.cache/helm
      - trivy-cache:/home/dev/.cache/trivy

      # --- credentials: READ-ONLY, and opt-in -------------------------------
      # Commented out by default. Uncomment only what you actually need, and
      # keep :ro. An AI agent with write access to ~/.aws is a bad afternoon.
      # - ${HOME}/.ssh:/home/dev/.ssh:ro
      # - ${HOME}/.aws:/home/dev/.aws:ro
      # - ${HOME}/.azure:/home/dev/.azure:ro
      # - ${HOME}/.config/gcloud:/home/dev/.config/gcloud:ro
      # - ${HOME}/.kube:/home/dev/.kube:ro
      #
      # Better than any of the above: use OIDC / workload identity / SSO and
      # mount nothing. See docs/security.md.

    environment:
      # --- AI provider credentials -----------------------------------------
      # Injected from the host environment or a .env file. NEVER baked into the
      # image, never committed. The `${VAR:-}` form means an unset variable is
      # simply absent rather than an error.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      # --- GitHub ----------------------------------------------------------
      # Use a fine-grained PAT scoped to contents:read, pull_requests:write,
      # issues:read. See mcp/profiles.yaml.
      GITHUB_PERSONAL_ACCESS_TOKEN: ${GITHUB_PERSONAL_ACCESS_TOKEN:-}
      # --- cloud (prefer role assumption / OIDC over these) ------------------
      AWS_PROFILE: ${AWS_PROFILE:-}
      AWS_REGION: ${AWS_REGION:-}
      GOOGLE_CLOUD_PROJECT: ${GOOGLE_CLOUD_PROJECT:-}
      # --- devbox ------------------------------------------------------------
      # Model backends (ai/models/models.yaml). Values come from .env.
      DEVBOX_GCP_PROJECT: ${DEVBOX_GCP_PROJECT:-}
      DEVBOX_GCP_ZONE: ${DEVBOX_GCP_ZONE:-}
      DEVBOX_MODELS_API_KEY: ${DEVBOX_MODELS_API_KEY:-}
      OLLAMA_API_KEY: ${OLLAMA_API_KEY:-}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.containers.internal:11434}
      TZ: ${TZ:-UTC}

    healthcheck:
      test: ["CMD", "/opt/devbox/bin/devbox", "doctor", "--quiet", "--core-only"]
      interval: 2m
      timeout: 30s
      start_period: 20s
      retries: 2

    # slirp4netns with host loopback: outbound internet for IAP tunnels and
    # ollama.com, plus the host's own Ollama daemon on 127.0.0.1:11434.
    network_mode: "slirp4netns:allow_host_loopback=true"
    # Files written to the bind-mounted workspace are owned by you on the host.
    userns_mode: keep-id

volumes:
  devbox-config:   {}
  devbox-state:    {}
  devbox-share:    {}
  devbox-history:  {}
  tf-plugin-cache: {}
  go-cache:        {}
  npm-cache:       {}
  uv-cache:        {}
  pip-cache:       {}
  helm-cache:      {}
  trivy-cache:     {}
